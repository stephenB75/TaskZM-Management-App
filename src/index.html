    <style>
      /* Define CSS variables early for splash screen */
      :root {
        --pastel-lavender: #E6D5F0;
        --pastel-sky: #C9E4F7;
        --pastel-mint: #B8E6D5;
        --primary: #9B87E8;
        --foreground: #1F2937;
        --background: #FAF9FC;
        --card: #FFFFFF;
      }
      
      @media (prefers-color-scheme: dark) {
        :root {
          --foreground: #F3F4F6;
          --background: #0F172A;
          --card: #1E293B;
        }
      }
      
      body {
        overflow: hidden;
      }
      
      body.loaded {
        overflow: auto;
      }

      /* Hide Capacitor splash overlay completely on web */
      body > div[id*="splash"],
      body > div[class*="splash"],
      body > div[class*="Splash"],
      body > div[id*="Splash"],
      .capacitor-splash,
      #capacitor-splash,
      [data-capacitor-splash] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /* Only show HTML splash on web - hidden by default on native */
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex !important;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to bottom right, #E6D5F0, #C9E4F7, #B8E6D5);
        background: linear-gradient(to bottom right, var(--pastel-lavender, #E6D5F0), var(--pastel-sky, #C9E4F7), var(--pastel-mint, #B8E6D5));
        z-index: 999999 !important; /* Matches Z_INDEX.SPLASH_SCREEN: 999999 */
        transition: opacity 0.5s ease-out;
        -webkit-transition: opacity 0.5s ease-out;
        visibility: visible !important;
        pointer-events: auto !important;
        opacity: 1 !important;
      }
      
      /* Dark mode support for splash background */
      @media (prefers-color-scheme: dark) {
        #initial-splash {
          background: linear-gradient(to bottom right, #0F172A, #1E293B, #0F172A);
          background: linear-gradient(to bottom right, var(--background, #0F172A), var(--card, #1E293B), var(--background, #0F172A));
        }
      }
      
      /* Splash content container */
      #initial-splash .splash-content {
        text-align: center;
        padding: 1rem;
        display: flex !important;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        visibility: visible !important;
        opacity: 1 !important;
      }

      /* Hide on native platforms */
      #initial-splash.native-hidden {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
      }

      #initial-splash.hidden {
        opacity: 0 !important;
        pointer-events: none !important;
        visibility: hidden !important;
        display: none !important;
        z-index: -1 !important;
      }

      #initial-splash img {
        width: auto;
        height: min(12rem, 20vw);
        max-width: 660px; /* Matches LOADING_SCREEN_LOGO.maxWidth: 220 * 3 = 660px */
        max-height: 15rem; /* Matches LOADING_SCREEN_LOGO.height.desktop: 5 * 3 = 15rem */
        filter: drop-shadow(0 8px 24px rgba(155, 135, 232, 0.25)); /* COLOR_PRIMARY (#9B87E8 = rgb(155, 135, 232)) with 0.25 opacity */
        -webkit-filter: drop-shadow(0 8px 24px rgba(155, 135, 232, 0.25));
        animation: fadeIn 0.5s ease-in;
        -webkit-animation: fadeIn 0.5s ease-in;
        object-fit: contain;
        display: block !important;
        margin: 0 auto 1.5rem auto;
        background: transparent;
        background-color: transparent;
        opacity: 1 !important;
        visibility: visible !important;
        position: relative;
        z-index: 1;
      }
      
      /* Ensure logo is always visible - override any conflicting styles */
      #initial-splash #splash-logo {
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
      }
      
      /* Spinner container */
      #initial-splash .splash-spinner {
        position: relative;
        margin: 0 auto 1rem auto;
        width: 3rem;
        height: 3rem;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        z-index: 2;
      }
      
      @media (min-width: 768px) {
        #initial-splash .splash-spinner {
          width: 4rem;
          height: 4rem;
        }
      }
      
      /* Spinner circles */
      #initial-splash .spinner-circle {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border-width: 4px;
        border-style: solid;
        margin: 0 auto;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        z-index: 1;
      }
      
      #initial-splash .spinner-circle-1 {
        border-top-color: var(--primary, #9B87E8);
        border-right-color: var(--pastel-lavender, #E6D5F0);
        border-bottom-color: var(--pastel-lavender, #E6D5F0);
        border-left-color: var(--pastel-lavender, #E6D5F0);
        animation: spin 1s linear infinite;
      }
      
      #initial-splash .spinner-circle-2 {
        border-top-color: transparent;
        border-right-color: var(--pastel-sky, #C9E4F7);
        border-bottom-color: var(--pastel-sky, #C9E4F7);
        border-left-color: var(--pastel-sky, #C9E4F7);
        animation: spin 1.5s linear infinite reverse;
      }
      
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      /* Loading message */
      #initial-splash .splash-message {
        margin-top: 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #1F2937;
        color: var(--foreground, #1F2937);
        font-family: system-ui, -apple-system, sans-serif;
      }
      
      @media (prefers-color-scheme: dark) {
        #initial-splash .splash-message {
          color: #F3F4F6;
          color: var(--foreground, #F3F4F6);
        }
      }
      
      @media (min-width: 768px) {
        #initial-splash .splash-message {
          font-size: 1rem;
        }
      }
      
      /* Loading dots */
      #initial-splash .splash-dots {
        display: flex !important;
        gap: 0.25rem;
        justify-content: center;
        margin-top: 0.75rem;
        visibility: visible !important;
        opacity: 1 !important;
      }
      
      #initial-splash .splash-dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background-color: var(--primary, #9B87E8);
        animation: bounce 1.4s ease-in-out infinite;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
      }
      
      #initial-splash .splash-dot:nth-child(1) {
        animation-delay: 0ms;
      }
      
      #initial-splash .splash-dot:nth-child(2) {
        animation-delay: 150ms;
      }
      
      #initial-splash .splash-dot:nth-child(3) {
        animation-delay: 300ms;
      }
      
      @keyframes bounce {
        0%, 80%, 100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }
      
      #initial-splash img.splash-logo-fallback {
        width: min(48vw, 220px);
        max-width: 260px;
        height: auto;
        object-fit: contain;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @-webkit-keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Mobile optimizations */
      @media (max-width: 768px) {
        #initial-splash img {
          height: min(12rem, 25vw);
          max-height: 12rem;
        }
      }

      /* Desktop optimizations */
      @media (min-width: 769px) {
        #initial-splash img {
          height: min(15rem, 20vw);
          max-height: 15rem;
        }
      }
    </style>
    
    <title>TaskZM</title>
  </head>
  <body>
    <!-- Immediately hide Capacitor splash on web to prevent double splash -->
    <script>
      (function() {
        'use strict';
        // Aggressively hide any Capacitor splash elements immediately
        function hideCapacitorSplash() {
          // Hide via CSS selectors
          const selectors = [
            'div[id*="splash"]',
            'div[class*="splash"]',
            'div[class*="Splash"]',
            '.capacitor-splash',
            '#capacitor-splash',
            '[data-capacitor-splash]'
          ];
          selectors.forEach(selector => {
            try {
              const elements = document.querySelectorAll(selector);
              elements.forEach(el => {
                if (el && el.id !== 'initial-splash') {
                  el.style.display = 'none';
                  el.style.visibility = 'hidden';
                  el.style.opacity = '0';
                  el.style.pointerEvents = 'none';
                }
              });
            } catch (e) {}
          });
          
          // Hide via Capacitor API
          if (typeof window !== 'undefined' && window.Capacitor) {
            try {
              if (window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen) {
                window.Capacitor.Plugins.SplashScreen.hide({ fadeOutDuration: 0 }).catch(function() {});
              }
              if (window.Capacitor.SplashScreen) {
                window.Capacitor.SplashScreen.hide({ fadeOutDuration: 0 }).catch(function() {});
              }
            } catch (e) {
              // Ignore errors
            }
          }
        }
        
        // Run immediately
        hideCapacitorSplash();
        
        // Also run on DOM ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', hideCapacitorSplash);
        } else {
          hideCapacitorSplash();
        }
        
        // Watch for dynamically added splash elements
        const observer = new MutationObserver(function(mutations) {
          hideCapacitorSplash();
        });
        
        if (document.body) {
          observer.observe(document.body, {
            childList: true,
            subtree: true
          });
        }
      })();
    </script>
    
    <div id="initial-splash">
      <div class="splash-content">
        <img 
          id="splash-logo"
          src="/taskzm-logo.png" 
          alt="TaskZM Logo" 
          onerror="handleSplashLogoError(this)"
          loading="eager"
          style="display: block !important; margin: 0 auto 1.5rem auto; width: auto; height: min(12rem, 20vw); max-width: 660px; max-height: 15rem; object-fit: contain; opacity: 1 !important; visibility: visible !important;"
        />
        <div class="splash-spinner">
          <div class="spinner-circle spinner-circle-1"></div>
          <div class="spinner-circle spinner-circle-2"></div>
        </div>
        <p class="splash-message" id="splash-message">Loading TaskZM...</p>
        <div class="splash-dots">
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
        </div>
      </div>
    </div>
    
    <script>
      // Splash Screen Constants (mirrors TypeScript constants from layout-constants.ts)
      var SPLASH_SCREEN_LOGO_PATHS = {
        primary: '/taskzm-logo.png',
        relative: './taskzm-logo.png',
        relativeNoSlash: 'taskzm-logo.png'
      };
      var SPLASH_SCREEN_TEXT = {
        logoAlt: 'TaskZM Logo',
        loadingMessage: 'Loading TaskZM...',
        fallbackText: 'TaskZM'
      };
      var LOADING_SCREEN_LOGO = {
        height: {
          mobile: '12rem', // LOADING_SCREEN_LOGO.height.mobile (4rem * 3 = 12rem)
          desktop: '15rem' // LOADING_SCREEN_LOGO.height.desktop (5rem * 3 = 15rem)
        },
        maxWidth: '660px', // LOADING_SCREEN_LOGO.maxWidth (220 * 3 = 660px)
        heightViewport: '20vw' // Responsive height using viewport width
      };
      var APP_TEXT_FALLBACK_COLOR = '#7B68EE'; // APP_TEXT_FALLBACK_COLOR from layout-constants.ts
      
      function handleSplashLogoError(img) {
        // Try multiple paths to find the logo (using constants)
        var paths = [
          SPLASH_SCREEN_LOGO_PATHS.primary,
          SPLASH_SCREEN_LOGO_PATHS.relative,
          SPLASH_SCREEN_LOGO_PATHS.relativeNoSlash,
          SPLASH_SCREEN_LOGO_PATHS.primary + '?v=' + Date.now(),
          SPLASH_SCREEN_LOGO_PATHS.relative + '?v=' + Date.now()
        ];
        var currentPathIndex = 0;
        
        function tryNextPath() {
          if (currentPathIndex >= paths.length) {
            // All paths failed - show text fallback
            showTextFallback(img);
            return;
          }
          
          var retrySrc = paths[currentPathIndex];
          var retryImg = new Image();
          
          retryImg.onload = function() {
            // Success! Update the original image
            img.src = retrySrc;
            img.style.setProperty('opacity', '1', 'important');
            img.style.setProperty('visibility', 'visible', 'important');
            img.style.setProperty('display', 'block', 'important');
          };
          
          retryImg.onerror = function() {
            // This path failed, try the next one
            currentPathIndex++;
            tryNextPath();
          };
          
          // Try loading the image
          retryImg.src = retrySrc;
        }
        
        // Start trying paths
        tryNextPath();
      }
      
      function showTextFallback(img) {
        var splashEl = document.getElementById('initial-splash');
        if (splashEl && img.parentNode) {
          // Try one more time - ensure image is visible with all styles
          img.style.setProperty('display', 'block', 'important');
          img.style.setProperty('visibility', 'visible', 'important');
          img.style.setProperty('opacity', '1', 'important');
          img.style.setProperty('width', 'auto', 'important');
          img.style.setProperty('height', 'min(' + LOADING_SCREEN_LOGO.height.mobile + ', ' + LOADING_SCREEN_LOGO.heightViewport + ')', 'important');
          img.style.setProperty('max-width', LOADING_SCREEN_LOGO.maxWidth, 'important');
          img.style.setProperty('max-height', LOADING_SCREEN_LOGO.height.desktop, 'important');
          
          // Only show text fallback if image still fails after delay
          setTimeout(function() {
            if (img.naturalWidth === 0 || img.naturalHeight === 0 || !img.complete) {
              var textFallback = document.createElement('div');
              textFallback.style.cssText = 'font-size:min(8vw, 48px);font-weight:bold;color:var(--primary, ' + APP_TEXT_FALLBACK_COLOR + ');text-align:center;font-family:system-ui,-apple-system,sans-serif;margin:0 auto 1.5rem auto;'; /* Uses APP_TEXT_FALLBACK_COLOR constant */
              textFallback.textContent = SPLASH_SCREEN_TEXT.fallbackText;
              if (img.parentNode) {
                img.parentNode.replaceChild(textFallback, img);
              }
            }
          }, 2000);
        }
      }
      
      // Ensure logo is visible immediately and stays visible
      (function() {
        var logo = document.getElementById('splash-logo');
        if (logo) {
          // Force visibility immediately - ensure logo shows from the start
          logo.style.setProperty('display', 'block', 'important');
          logo.style.setProperty('visibility', 'visible', 'important');
          logo.style.setProperty('opacity', '1', 'important');
          
          // If already loaded (cached), show immediately
          if (logo.complete && logo.naturalHeight !== 0) {
            logo.style.setProperty('opacity', '1', 'important');
            logo.style.setProperty('visibility', 'visible', 'important');
            logo.style.setProperty('display', 'block', 'important');
          } else {
            // Otherwise wait for load
            logo.onload = function() {
              this.style.setProperty('opacity', '1', 'important');
              this.style.setProperty('visibility', 'visible', 'important');
              this.style.setProperty('display', 'block', 'important');
              this.style.transition = 'opacity 0.3s ease-in';
            };
            // Set initial opacity after a tiny delay to allow for fade-in
            setTimeout(function() {
              if (logo) {
                logo.style.setProperty('opacity', '1', 'important');
                logo.style.setProperty('visibility', 'visible', 'important');
                logo.style.setProperty('display', 'block', 'important');
                if (logo.complete) {
                  logo.style.transition = 'opacity 0.3s ease-in';
                }
              }
            }, 50);
          }
          
          // Additional check: ensure logo is visible after a short delay
          setTimeout(function() {
            if (logo && logo.parentNode) {
              logo.style.setProperty('display', 'block', 'important');
              logo.style.setProperty('visibility', 'visible', 'important');
              logo.style.setProperty('opacity', '1', 'important');
            }
          }, 100);
          
          // Additional check: ensure logo is visible after a short delay
          setTimeout(function() {
            if (logo && logo.parentNode) {
              logo.style.display = 'block';
              logo.style.visibility = 'visible';
              logo.style.opacity = '1';
            }
          }, 100);
        }
      })();
    </script>
    <div id="root"></div>
    
    <!-- Inline script: Default to web splash, hide only on native platforms -->
    <script>
      (function() {
        'use strict';
        
        // Default: Show HTML splash for web
        // Only hide if we detect a native platform (Capacitor)
        const isNative = typeof window !== 'undefined' && 
                      window.Capacitor && 
                      window.Capacitor.isNativePlatform && 
                      window.Capacitor.isNativePlatform();
        
        if (isNative) {
          // NATIVE PLATFORM: Hide HTML splash, use Capacitor's native splash
          const splashEl = document.getElementById('initial-splash');
          if (splashEl) {
            splashEl.classList.add('native-hidden');
            setTimeout(function() {
              if (splashEl.parentNode) {
                splashEl.remove();
              }
            }, 0);
          }
        } else {
          // WEB PLATFORM (default): Show HTML splash ONLY, completely hide Capacitor splash
          // Force hide Capacitor splash immediately to prevent double splash
          function hideAllSplashExceptOurs() {
            // Hide any splash elements except our own
            const allDivs = document.querySelectorAll('body > div');
            allDivs.forEach(div => {
              if (div && div.id !== 'initial-splash' && div.id !== 'root') {
                const id = div.id || '';
                const className = div.className || '';
                if (id.includes('splash') || className.includes('splash') || 
                    id.includes('Splash') || className.includes('Splash') ||
                    id === 'capacitor-splash' || className.includes('capacitor-splash')) {
                  div.style.display = 'none';
                  div.style.visibility = 'hidden';
                  div.style.opacity = '0';
                  div.style.pointerEvents = 'none';
                }
              }
            });
            
            // Hide via Capacitor API
            if (window.Capacitor) {
              try {
                if (window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen) {
                  window.Capacitor.Plugins.SplashScreen.hide({ fadeOutDuration: 0 }).catch(function() {});
                }
                if (window.Capacitor.SplashScreen) {
                  window.Capacitor.SplashScreen.hide({ fadeOutDuration: 0 }).catch(function() {});
                }
              } catch (e) {
                // Ignore - Capacitor may not be available on web
              }
            }
          }
          
          hideAllSplashExceptOurs();
          
          // Keep checking for any new splash elements
          setInterval(hideAllSplashExceptOurs, 100);
        }
      })();
    </script>
    
    <script type="module" src="/main.tsx"></script>
    <!-- Service Worker registration moved to main.tsx for better error handling -->
  </body>
