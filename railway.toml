[build]
builder = "nixpacks"
buildCommand = "node scripts/bump-build-number.js --ci && node scripts/update-service-worker-cache.js && cd src && npm ci && npm run build && cd .. && node scripts/write-build-info.js"

[deploy]
startCommand = "cd src && node server.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
PORT = "4173"
NODE_VERSION = "22"

