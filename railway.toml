[build]
builder = "nixpacks"
buildCommand = "npm ci && node scripts/update-service-worker-cache.js && npm run build --prefix src && node scripts/write-build-info.js"

[deploy]
startCommand = "cd src && node server.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
PORT = "4173"
NODE_VERSION = "22"

